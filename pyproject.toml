[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "lilybench"
version = "0.1.0"
description = "LilyPond code-generation benchmark: dataset builder, LoRA fine-tuning, and evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Matteo Spanio", email = "spanio@dei.unipd.it"},
    {name = "Mohammad Torabi", email = "mohamad.torabi76@gmail.com"},
]
keywords = ["lilypond", "music", "nlp", "gpt", "fine-tuning", "lora"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=1.5",
    "music21>=9.1",
    "python-ly>=0.9.10",
    "transformers>=4.40",
    "torch>=2.5",
    "tqdm>=4.67.1",
    "hydra-core>=1.3",
    "hydra-submitit-launcher>=1.2",
    "muspy>=0.5.0",
    "sentencepiece>=0.2.1",
]

[tool.setuptools.packages.find]
include = ["lilybench*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
]
train = [
    "peft>=0.4",
    "accelerate>=0.20",
    "tensorboard>=2.13",
    "wandb>=0.26.0",
    "bitsandbytes>=0.43",
    "kernels>=0.4",
]
eval = [
    "scipy>=1.10",
    "numpy>=1.24",
]

[project.scripts]
lilybench = "lilybench.cli:main"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
