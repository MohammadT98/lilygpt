[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "lilynorm"
version = "0.1.0"
description = "LilyPond normalization + tokenization pipeline"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "peft>=0.4",
    "accelerate>=0.20",
    "tensorboard>=2.13",
]
full = [
    "torch>=2.0",
    "peft>=0.4",
    "accelerate>=0.20",
    "tensorboard>=2.13",
]

[tool.setuptools.packages.find]
where = ["src"]  

[project.scripts]
lilynorm = "lilynorm.cli:main" 
